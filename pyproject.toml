[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "myumiq-vrchat"
version = "0.1.0"
description = "Local LLM intentions, a virtual body, and supervised VR device outputs"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pamiq-core==0.6.0", "pydantic>=2.11,<3", "httpx>=0.28,<1", "python-osc>=1.9,<2", "numpy>=2.2,<3"]

[project.optional-dependencies]
vr = ["openvr>=2.12,<3"]
voice = [
  "faster-whisper>=1.2,<2",
  "numpy>=2.2,<3",
  "onnxruntime>=1.20,<2",
  "sounddevice>=0.5,<1",
  "soundcard>=0.4.5,<0.5",
]
vision = [
  "windows-capture==2.0.1; sys_platform == 'win32'",
  "mss>=10,<11",
  "numpy>=2.2,<3",
  "onnxruntime>=1.20,<2",
  "opencv-python>=4.12,<5; sys_platform == 'win32'",
  "opencv-python-headless>=4.12,<5; sys_platform != 'win32'",
]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
learning = ["stable-baselines3==2.7.1", "gymnasium==1.2.3"]
wholebody-rl = ["stable-baselines3==2.7.1", "gymnasium[mujoco]==1.2.3", "mujoco==3.13.0"]
motion = ["numpy>=2.2,<3"]
decision = ["transformers==4.57.6", "qwen-vl-utils==0.0.14", "accelerate>=1.10,<2",
            "torch==2.8.0", "torchvision==0.23.0", "einops>=0.8,<1", "timm>=1.0,<2",
            "Pillow>=11,<13"]

[project.scripts]
myumiq = "myumiq_vrchat.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "../myumiq-vrchat.local-artifacts/pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "../myumiq-vrchat.local-artifacts/ruff-cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
